
# Application
spring.application.name=justkafkait-backend
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/justkafkait}
spring.datasource.username=${DB_USERNAME:justkafkait}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

logging.level.liquibase=DEBUG
logging.level.liquibase.integration=DEBUG

# Kafka (default local connection)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
